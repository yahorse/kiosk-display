<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kiosk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0f;
    color: #e8e8ed;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 20px;
    padding: 24px 24px 48px 24px;
    cursor: none;
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 32px;
  }

  .clock { text-align: center; }

  .clock-time {
    font-size: clamp(64px, 12vw, 140px);
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, #a0a0b0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .clock-seconds {
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 300;
    opacity: 0.4;
    vertical-align: super;
  }

  .clock-date {
    font-size: clamp(14px, 2.5vw, 24px);
    font-weight: 400;
    color: #888;
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  .weather {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: 20px 32px;
    backdrop-filter: blur(10px);
  }

  .weather-icon { font-size: clamp(36px, 5vw, 56px); }
  .weather-info { display: flex; flex-direction: column; }
  .weather-temp { font-size: clamp(28px, 4vw, 44px); font-weight: 600; }
  .weather-desc { font-size: clamp(12px, 1.8vw, 16px); color: #888; text-transform: capitalize; }
  .weather-details { display: flex; gap: 16px; margin-top: 4px; font-size: clamp(10px, 1.4vw, 13px); color: #666; }
  .weather-details span { display: flex; align-items: center; gap: 4px; }

  /* Right panel: Month grid + today's events */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    gap: 10px;
  }

  /* Monthly calendar grid */
  .month-header {
    font-size: clamp(16px, 2.5vw, 24px);
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding-left: 4px;
    margin-bottom: 4px;
  }

  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    padding: 0 4px;
  }

  .month-grid .day-label {
    text-align: center;
    font-size: clamp(11px, 1.5vw, 14px);
    color: #555;
    font-weight: 600;
    text-transform: uppercase;
    padding-bottom: 6px;
  }

  .month-grid .day {
    text-align: center;
    font-size: clamp(14px, 2vw, 20px);
    padding: 8px 4px;
    border-radius: 10px;
    position: relative;
    color: #666;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s;
  }

  .month-grid .day.current-month { color: #bbb; }
  .month-grid .day.selected {
    background: rgba(99, 102, 241, 0.25);
    color: white;
    font-weight: 600;
  }
  .month-grid .day.selected.today {
    background: #6366f1;
  }
  .month-grid .day.today {
    background: #6366f1;
    color: white;
    font-weight: 700;
  }

  .month-grid .day.has-events::after {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6366f1;
    margin: 1px auto 0;
  }

  .month-grid .day.today.has-events::after { background: white; }

  .month-grid .day.has-ruth::after {
    background: #f472b6;
  }

  .month-grid .day.has-events.has-ruth::after {
    width: 14px;
    height: 6px;
    border-radius: 2px;
    background: linear-gradient(90deg, #6366f1 50%, #f472b6 50%);
  }

  .month-grid .day.today.has-events.has-ruth::after {
    background: linear-gradient(90deg, white 50%, #f472b6 50%);
  }

  /* Divider */
  .section-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.06);
    margin: 4px 0;
  }

  /* Today's events */
  .today-header {
    font-size: clamp(13px, 1.8vw, 17px);
    font-weight: 600;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-left: 4px;
    flex-shrink: 0;
  }

  .calendar-events {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    scrollbar-width: none;
  }

  .calendar-events::-webkit-scrollbar { display: none; }

  .event {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: background 0.3s;
    flex-shrink: 0;
  }

  .event.now {
    background: rgba(99, 102, 241, 0.12);
    border-color: rgba(99, 102, 241, 0.3);
  }

  .event-time {
    font-size: clamp(13px, 1.8vw, 16px);
    color: #6366f1;
    font-weight: 600;
    min-width: 55px;
    padding-top: 1px;
  }

  .event.ruth .event-time { color: #f472b6; }
  .event.now .event-time { color: #818cf8; }
  .event-content { flex: 1; }

  .event-title {
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 500;
    line-height: 1.3;
  }

  .event-owner {
    font-size: clamp(11px, 1.4vw, 13px);
    color: #555;
    margin-top: 2px;
  }

  .event-location {
    font-size: clamp(11px, 1.4vw, 13px);
    color: #555;
    margin-top: 2px;
  }

  .event-bar {
    width: 4px;
    border-radius: 3px;
    background: #6366f1;
    align-self: stretch;
    min-height: 20px;
  }

  .event.ruth .event-bar { background: #f472b6; }

  .no-events {
    color: #444;
    font-size: clamp(14px, 2vw, 18px);
    text-align: center;
    margin-top: 16px;
  }

  /* Legend */
  .cal-legend {
    display: flex;
    gap: 16px;
    padding-left: 4px;
    font-size: clamp(9px, 1.1vw, 11px);
    color: #555;
  }
  .cal-legend span { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .legend-dot.you { background: #6366f1; }
  .legend-dot.ruth { background: #f472b6; }

  /* News ticker */
  .news-ticker {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: rgba(0, 0, 0, 0.85);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .news-label {
    background: #ef4444;
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    flex-shrink: 0;
    height: 100%;
    display: flex;
    align-items: center;
  }

  .news-scroll {
    display: flex;
    animation: ticker linear infinite;
    white-space: nowrap;
  }

  .news-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 32px;
    font-size: 14px;
    color: #ccc;
    flex-shrink: 0;
  }

  .news-source { color: #6366f1; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .news-dot { color: #333; }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .status-bar {
    position: fixed;
    bottom: 44px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #333;
  }

  .loading { color: #444; font-size: 14px; }
  .error { color: #ef4444; font-size: 13px; padding: 12px; background: rgba(239,68,68,0.1); border-radius: 10px; }

  @media (max-aspect-ratio: 1/1) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  }
</style>
</head>
<body>

<div class="left-panel">
  <div class="clock">
    <div class="clock-time" id="clock-time">--:--</div>
    <div class="clock-date" id="clock-date">---</div>
  </div>
  <div class="weather" id="weather">
    <div class="loading">Getting weather...</div>
  </div>
</div>

<div class="right-panel">
  <div class="month-header" id="month-header">---</div>
  <div class="month-grid" id="month-grid"></div>
  <div class="cal-legend">
    <span><span class="legend-dot you"></span> You</span>
    <span><span class="legend-dot ruth"></span> Ruth</span>
  </div>
  <div class="section-divider"></div>
  <div class="today-header">Today</div>
  <div class="calendar-events" id="calendar-events">
    <div class="loading">Loading calendar...</div>
  </div>
</div>

<div class="news-ticker" id="news-ticker">
  <div class="news-label">Live</div>
  <div class="news-scroll" id="news-scroll">
    <div class="news-item">Loading headlines...</div>
  </div>
</div>

<div class="status-bar">
  <span id="status-left"></span>
  <span id="status-right"></span>
</div>

<script>
const CONFIG = {
  proxyUrl: 'https://script.google.com/macros/s/AKfycbyQjgAtglM0tZDvYJc5YBHisk-Lad7brys6nfRZJRoc8gtffPi0NRiICmQCWQwhYMP7lQ/exec',
  weatherUnits: 'celsius',
  fallbackLat: 53.35,
  fallbackLon: -6.26,
  weatherRefreshMs: 15 * 60 * 1000,
  calendarRefreshMs: 5 * 60 * 1000,
  newsRefreshMs: 10 * 60 * 1000,
};

// ============ CLOCK ============
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('clock-time').innerHTML =
    `${h12}:${m} <span class="clock-seconds">${ampm}</span>`;
  const options = { weekday: 'long', month: 'long', day: 'numeric' };
  document.getElementById('clock-date').textContent =
    now.toLocaleDateString('en-US', options);
}
setInterval(updateClock, 1000);
updateClock();

// ============ WEATHER ============
const WMO_CODES = {
  0:['Clear sky','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
  45:['Foggy','🌫️'],48:['Icy fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],
  55:['Heavy drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],
  71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow grains','🌨️'],
  80:['Light showers','🌦️'],81:['Showers','🌧️'],82:['Heavy showers','🌧️'],
  85:['Snow showers','🌨️'],86:['Heavy snow showers','❄️'],
  95:['Thunderstorm','⛈️'],96:['Thunderstorm + hail','⛈️'],99:['Heavy thunderstorm','⛈️'],
};

async function fetchWeather() {
  const el = document.getElementById('weather');
  try {
    let lat, lon;
    try {
      const pos = await new Promise((resolve, reject) =>
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 })
      );
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
    } catch (geoErr) {
      lat = CONFIG.fallbackLat;
      lon = CONFIG.fallbackLon;
    }
    const unit = CONFIG.weatherUnits === 'fahrenheit' ? 'fahrenheit' : 'celsius';
    const windUnit = unit === 'fahrenheit' ? 'mph' : 'kmh';
    const resp = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
      `&temperature_unit=${unit}&wind_speed_unit=${windUnit}&timezone=auto`
    );
    const data = await resp.json();
    const c = data.current;
    const [desc, icon] = WMO_CODES[c.weather_code] || ['Unknown', '🌡️'];
    const unitSymbol = unit === 'fahrenheit' ? '°F' : '°C';
    const windLabel = unit === 'fahrenheit' ? 'mph' : 'km/h';
    el.innerHTML = `
      <div class="weather-icon">${icon}</div>
      <div class="weather-info">
        <div class="weather-temp">${Math.round(c.temperature_2m)}${unitSymbol}</div>
        <div class="weather-desc">${desc}</div>
        <div class="weather-details">
          <span>💧 ${c.relative_humidity_2m}%</span>
          <span>💨 ${Math.round(c.wind_speed_10m)} ${windLabel}</span>
          <span>🌡️ ${Math.round(c.apparent_temperature)}${unitSymbol} feels</span>
        </div>
      </div>`;
    document.getElementById('status-left').textContent = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
  } catch (err) {
    el.innerHTML = `<div class="error">Weather: ${err.message}</div>`;
  }
}
fetchWeather();
setInterval(fetchWeather, CONFIG.weatherRefreshMs);

// ============ MONTHLY CALENDAR + EVENTS ============
let monthEvents = [];
let selectedDay = new Date().getDate();
let autoResetTimer = null;

function selectDay(day) {
  selectedDay = day;
  highlightSelected();
  renderDayEvents(monthEvents, day);

  // Auto-reset to today after 30 seconds of no interaction
  clearTimeout(autoResetTimer);
  const today = new Date().getDate();
  if (day !== today) {
    autoResetTimer = setTimeout(() => {
      selectedDay = new Date().getDate();
      highlightSelected();
      renderDayEvents(monthEvents, selectedDay);
    }, 30000);
  }
}

function highlightSelected() {
  document.querySelectorAll('.month-grid .day.current-month').forEach(el => {
    const d = parseInt(el.textContent);
    el.classList.toggle('selected', d === selectedDay);
  });
}

function renderMonthGrid(events) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();

  document.getElementById('month-header').textContent =
    now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();

  const eventDays = {};
  const ruthDays = {};
  for (const ev of events) {
    const dateStr = ev.start.dateTime || ev.start.date;
    if (!dateStr) continue;
    const d = new Date(dateStr).getDate();
    if (ev.isRuth) ruthDays[d] = true;
    else eventDays[d] = true;
  }

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const startOffset = (firstDay + 6) % 7;

  let html = '';
  const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  for (const label of dayLabels) {
    html += `<div class="day-label">${label}</div>`;
  }

  for (let i = startOffset - 1; i >= 0; i--) {
    html += `<div class="day">${daysInPrev - i}</div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const classes = ['day', 'current-month'];
    if (d === today) classes.push('today');
    if (d === selectedDay) classes.push('selected');
    if (eventDays[d]) classes.push('has-events');
    if (ruthDays[d]) classes.push('has-ruth');
    html += `<div class="${classes.join(' ')}" onclick="selectDay(${d})">${d}</div>`;
  }

  const totalCells = startOffset + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="day">${d}</div>`;
  }

  document.getElementById('month-grid').innerHTML = html;
}

function renderDayEvents(events, day) {
  const el = document.getElementById('calendar-events');
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const targetDate = new Date(year, month, day);
  const targetStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const isToday = day === now.getDate();

  // Update header
  if (isToday) {
    document.querySelector('.today-header').textContent = 'Today';
  } else {
    document.querySelector('.today-header').textContent =
      targetDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  const dayEvents = events.filter(ev => {
    const dateStr = ev.start.dateTime || ev.start.date || '';
    return dateStr.startsWith(targetStr);
  });

  if (!dayEvents.length) {
    el.innerHTML = `<div class="no-events">No events${isToday ? ' today' : ''}</div>`;
    return;
  }

  el.innerHTML = dayEvents.map(event => {
    const start = event.start?.dateTime ? new Date(event.start.dateTime) : null;
    const end = event.end?.dateTime ? new Date(event.end.dateTime) : null;
    const allDay = !start;
    const isNow = isToday && start && end && now >= start && now <= end;
    const isRuth = event.isRuth;

    const timeStr = allDay ? 'All day' :
      start.toLocaleTimeString('en-IE', { hour: '2-digit', minute: '2-digit', hour12: false });

    const title = event.summary || 'Untitled';
    const safeTitle = title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const safeLoc = event.location ? event.location.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';

    return `
      <div class="event ${isNow ? 'now' : ''} ${isRuth ? 'ruth' : ''}">
        <div class="event-bar"></div>
        <div class="event-time">${timeStr}</div>
        <div class="event-content">
          <div class="event-title">${safeTitle}</div>
          ${isRuth ? '<div class="event-owner">Ruth</div>' : ''}
          ${safeLoc ? `<div class="event-location">${safeLoc}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

async function fetchCalendar() {
  if (!CONFIG.proxyUrl) {
    renderMonthGrid([]);
    document.getElementById('calendar-events').innerHTML =
      '<div class="no-events">Set proxyUrl in config</div>';
    return;
  }

  try {
    const resp = await fetch(CONFIG.proxyUrl + '?action=events&month=full');
    const data = await resp.json();
    monthEvents = data.events || [];
    renderMonthGrid(monthEvents);
    renderDayEvents(monthEvents, selectedDay);
    document.getElementById('status-right').textContent =
      `Synced ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    document.getElementById('calendar-events').innerHTML =
      `<div class="error">Calendar: ${err.message}</div>`;
    renderMonthGrid([]);
  }
}

fetchCalendar();
setInterval(fetchCalendar, CONFIG.calendarRefreshMs);

// ============ KEEP ALIVE ============
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// ============ NEWS TICKER ============
const RSS_SERVICES = [
  (url) => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`,
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
];

const NEWS_FEEDS = [
  { url: 'https://news.google.com/rss?hl=en-GB&gl=IE&ceid=IE:en', name: 'Google News' },
  { url: 'https://feeds.bbci.co.uk/news/rss.xml', name: 'BBC News' },
];

function parseXMLFeed(text, sourceName) {
  const articles = [];
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/xml');
  const items = doc.querySelectorAll('item');
  items.forEach((item, i) => {
    if (i >= 10) return;
    const title = item.querySelector('title')?.textContent || '';
    if (title) articles.push({ title, source: sourceName });
  });
  return articles;
}

async function fetchNews() {
  const allArticles = [];

  for (const feed of NEWS_FEEDS) {
    try {
      const resp = await fetch(RSS_SERVICES[0](feed.url));
      const data = await resp.json();
      if (data.status === 'ok' && data.items?.length) {
        for (const item of data.items.slice(0, 8)) {
          allArticles.push({ title: item.title, source: feed.name });
        }
        continue;
      }
    } catch (e) {}
    try {
      const resp = await fetch(RSS_SERVICES[1](feed.url));
      const text = await resp.text();
      allArticles.push(...parseXMLFeed(text, feed.name));
    } catch (e) {}
  }

  if (!allArticles.length && CONFIG.proxyUrl) {
    try {
      const resp = await fetch(CONFIG.proxyUrl + '?action=news');
      const data = await resp.json();
      for (const a of (data.articles || [])) {
        allArticles.push({ title: a.title, source: a.source || 'News' });
      }
    } catch (e) {}
  }

  const scrollEl = document.getElementById('news-scroll');
  if (!allArticles.length) {
    scrollEl.innerHTML = '<div class="news-item">No headlines available</div>';
    return;
  }

  for (let i = allArticles.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allArticles[i], allArticles[j]] = [allArticles[j], allArticles[i]];
  }

  const items = allArticles.map(a =>
    `<div class="news-item"><span class="news-source">${a.source.replace(/</g, '&lt;')}</span> ${a.title.replace(/</g, '&lt;')}</div>`
  ).join('<span class="news-dot">&bull;</span>');

  scrollEl.innerHTML = items + '<span class="news-dot">&bull;</span>' + items;

  requestAnimationFrame(() => {
    const width = scrollEl.scrollWidth / 2;
    scrollEl.style.animationDuration = (width / 60) + 's';
  });
}

fetchNews();
setInterval(fetchNews, CONFIG.newsRefreshMs);
</script>
</body>
</html>
